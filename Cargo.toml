[package]
name = "neyuki"
version = "0.1.1"
edition = "2024"
description = "A small Lua-like scripting language implemented in Rust"
readme = "README.md"
license = "MIT"
repository = "https://github.com/neyuki-lang/neyuki"
homepage = "https://neyuki.cc/"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rand = "0.8"
tiny_http = "0.12"
# `native-tls` keeps the build free of C compilers (rustls needs `ring`/`aws-lc`).
# schannel 0.1.28+ links Windows APIs with `raw-dylib`, which needs `dlltool`
# on the windows-gnu toolchain; older versions use prebuilt import libraries.
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip", "charset"] }

# `@neyuki/crypto` is built on the pure-Rust RustCrypto / dalek crates so the
# build stays free of C toolchains (`ring`, OpenSSL). These are all from the
# digest-0.10 / rand_core-0.6 generation, which matches `rand` above.
md-5 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
hkdf = "0.12"
argon2 = "0.5"
bcrypt = "0.16"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
rsa = { version = "0.9", features = ["sha2"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
pkcs8 = { version = "0.10", features = ["pem", "std"] }
base64 = "0.22"
subtle = "2"

# `@neyuki/sql` speaks to PostgreSQL and MySQL/MariaDB through these pure-Rust
# drivers, with TLS through the platform `native-tls` like `ureq` above. The
# `mysql` defaults are dropped because they pull in the C zlib; `minimal-rust`
# swaps in the Rust one. `postgres-protocol` decodes the wire values that the
# `postgres` crate leaves to companion crates (dates, uuids, arrays).
postgres = "0.19"
postgres-native-tls = "0.5"
postgres-protocol = "0.6"
native-tls = "0.2"
fallible-iterator = "0.2"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls", "buffer-pool"] }

# `@neyuki/ui` opens windows through `winit`, blits CPU-rendered frames with
# `softbuffer` and draws them with `tiny-skia` and `fontdue`; `png` loads
# images. All pure Rust, so no GPU, GL or C compiler is needed. On Linux the
# X11, Wayland and xkbcommon client libraries are loaded at runtime (dlopen)
# rather than linked, so a build machine needs none of them and a headless
# machine still runs everything else.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
softbuffer = "0.4"
tiny-skia = "0.11"
fontdue = "0.9"
png = "0.18"

[target.'cfg(windows)'.dependencies]
schannel = ">=0.1.23, <0.1.28"

# Debug builds still optimize dependencies: the crypto crates run 10-50x
# slower unoptimized, enough that `hashPassword` and `pbkdf2` at their default
# costs take seconds under `cargo run` and `cargo test`.
[profile.dev.package."*"]
opt-level = 3

# Optimized for speed and small binary size. `panic = "abort"` is intentionally
# omitted: lint.rs/compiler.rs/runtime.rs rely on `catch_unwind` to turn parser
# panics into recoverable errors, which abort would defeat.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
